name: Build container images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ltrain-7/ws2000-weather-dashboard
          tags: |
            type=ref,event=tag
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select published tag
        id: image
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=ghcr.io/ltrain-7/ws2000-weather-dashboard:stable" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/ltrain-7/ws2000-weather-dashboard:edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify container health
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform "$PLATFORM" "$IMAGE"
          container="ws2000-smoke-${PLATFORM//\//-}"
          docker run -d --name "$container" --platform "$PLATFORM" "$IMAGE"
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
            if [[ "$status" == healthy ]]; then
              exit 0
            fi
            if [[ "$status" == running ]] && docker exec "$container" \
              node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            if [[ "$status" == unhealthy || "$status" == exited ]]; then
              exit 1
            fi
            sleep 3
          done
          exit 1
