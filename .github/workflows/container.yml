name: Build container images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/ltrain-7/ws2000-weather-dashboard
          tags: |
            type=ref,event=tag
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest published image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/ltrain-7/ws2000-weather-dashboard
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  smoke-test:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select published tag
        id: image
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=ghcr.io/ltrain-7/ws2000-weather-dashboard:stable" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/ltrain-7/ws2000-weather-dashboard:edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify container health
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform "$PLATFORM" "$IMAGE"
          container="ws2000-smoke-${PLATFORM//\//-}"
          docker run -d --name "$container" --platform "$PLATFORM" "$IMAGE"
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
            if [[ "$status" == healthy ]]; then
              exit 0
            fi
            if [[ "$status" == running ]] && docker exec "$container" \
              node -e "Promise.all(['/api/health','/api/admin','/manifest.webmanifest'].map(p=>fetch('http://127.0.0.1:3000'+p).then(r=>{if(!r.ok)throw Error(p)}))).then(()=>process.exit(0)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            if [[ "$status" == unhealthy || "$status" == exited ]]; then
              exit 1
            fi
            sleep 3
          done
          exit 1

  pull-request-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build pull request image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: ws2000-dashboard:pull-request
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify dashboard health
        shell: bash
        run: |
          set -euo pipefail
          container=ws2000-pr-smoke
          docker run -d --name "$container" ws2000-dashboard:pull-request
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          for attempt in {1..30}; do
            if docker exec "$container" \
              node -e "Promise.all(['/api/health','/api/admin','/manifest.webmanifest'].map(p=>fetch('http://127.0.0.1:3000'+p).then(r=>{if(!r.ok)throw Error(p)}))).then(()=>process.exit(0)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            status="$(docker inspect --format '{{.State.Status}}' "$container")"
            [[ "$status" == exited ]] && exit 1
            sleep 3
          done
          exit 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
