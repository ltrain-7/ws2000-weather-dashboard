services:
  ws2000-dashboard:
    image: "${WS2000_IMAGE:-ghcr.io/ltrain-7/ws2000-weather-dashboard:stable}"
    container_name: ws2000-dashboard
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      SQLITE_DB_PATH: /app/data/weather.db
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs:ro
    mem_limit: "${CONTAINER_MEMORY_LIMIT:-256m}"
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"const t=['1','true','yes','on'].includes(String(process.env.TLS_ENABLED||'').toLowerCase());const h=require(t?'node:https':'node:http');const r=h.get({hostname:'127.0.0.1',port:3000,path:'/api/health',rejectUnauthorized:false},x=>process.exit(x.statusCode===200?0:1));r.on('error',()=>process.exit(1))\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-5m}"
        max-file: "${LOG_MAX_FILES:-2}"
