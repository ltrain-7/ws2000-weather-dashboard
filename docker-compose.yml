services:
  ws2000-dashboard:
    image: "${WS2000_IMAGE:-ghcr.io/ltrain-7/ws2000-weather-dashboard:stable}"
    container_name: ws2000-dashboard
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      SQLITE_DB_PATH: /app/data/weather.db
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    mem_limit: "${CONTAINER_MEMORY_LIMIT:-256m}"
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-5m}"
        max-file: "${LOG_MAX_FILES:-2}"
